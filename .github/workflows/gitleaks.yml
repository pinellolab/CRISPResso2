name: gitleaks
on:
  pull_request:
  push:
  workflow_dispatch:

# Scan with the free/open-source gitleaks CLI. Unlike gitleaks/gitleaks-action,
# this needs no license and works on pull requests opened from forks (which
# never receive repository secrets such as GITLEAKS_LICENSE).
permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for leaked secrets
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 14
          if-no-files-found: ignore
