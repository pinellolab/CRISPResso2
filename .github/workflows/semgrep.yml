name: Semgrep

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    # Pinned OSS image; no SEMGREP_APP_TOKEN, no account, fully free.
    container:
      image: semgrep/semgrep:1.166.0
    steps:
      - uses: actions/checkout@v4

      # --metrics=off + pinned packs => code never leaves the runner (private-repo safe).
      # --error fails the job on any ERROR-severity finding; suppress accepted ones with # nosemgrep.
      #
      # --exclude-rule subprocess-shell-true: every shell=True call in this repo builds its
      # command from internal, trusted strings (no untrusted input), so this rule is all
      # false positives here. Excluding it keeps the job signal-only instead of failing on
      # every push. Remove the exclusion if untrusted input ever reaches a subprocess call.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/flask \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/dockerfile \
            --exclude-rule=python.lang.security.audit.subprocess-shell-true.subprocess-shell-true \
            --severity=ERROR \
            --metrics=off \
            --error
